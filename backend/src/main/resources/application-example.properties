spring.application.name=negocut

# 데이터베이스 (로컬 MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/negocut?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL 로그. Hibernate에 이미 있는 로그를 보이게 하는 설정이다.
# SQL=debug     DB로 보내는 SQL 문장
# bind=trace    SQL의 ? 자리에 들어간 실제 값. 기본 수준(info)에서는 둘 다 안 보인다.
# 콘솔에만 출력되며 파일로 남기려면 logging.file.name 을 추가한다.
# bind는 비밀번호 해시·인증번호·배송지를 그대로 찍으므로 공유 시에는 끈다.
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# CORS. 프런트엔드(Vite 개발 서버) 주소를 허용한다.
# 여러 개면 쉼표로 구분한다. 리프레시 토큰 쿠키를 주고받으므로 * 는 쓸 수 없고 정확한 주소를 적는다.
app.cors.allowed-origins=http://localhost:5173

# 초기 데이터. docs/db/initial_data.sql은 Git에 올라가지 않는다. 파일이 없으면 아래 세 줄을 뺀다.
# 경로는 앱 실행 위치(backend/) 기준이다.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=file:../docs/db/initial_data.sql

# 이메일 검증 토큰 서명 키. 32바이트 이상의 임의 문자열을 직접 만들어 넣는다. 공유하지 않는다.
app.verification-token.secret=

# 인증 메일. false 이면 메일 대신 콘솔에 인증번호를 출력한다(개발용).
# true 이면 아래 SMTP 설정과 발신 주소가 필요하다.
app.mail.enabled=false
